name: Daily Stock Analysis

on:
  schedule:
    - cron: '30 10 * * 1-5' # 4:00 PM IST (Mon-Fri)
  workflow_dispatch: # Allows manual run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas gspread google-auth

      - name: Run Analysis
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python dashboard_worker.py
        # NEW: Commit and push the data.json file back to your main branch
      - name: Commit and Push Data to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 Automated data.json sync [skip ci]" || echo "No changes to commit"
          git push
