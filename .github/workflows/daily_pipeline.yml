name: Daily pipeline

# Runs every module (annual-report batch, Swing Setup Radar, Quality Value Rebound, Shariah), validates and publishes the results and
# saves all data to the `data` branch of THIS repository. Safe to re-run: finished work is cached, interrupted work resumes.
on:
  schedule:
    - cron: "45 10 * * 1-5"          # 10:45 UTC = 16:15 IST, Monday-Friday, after the NSE close
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated modules to run (empty = all enabled)"
        required: false
        default: ""
      resume:
        description: "Only resume / retry what the last run left unfinished"
        type: boolean
        default: false
      time_budget_minutes:
        description: "Stop starting new work after this many minutes (the job limit is 355)"
        required: false
        default: "330"

permissions:
  contents: write

concurrency:
  group: mizan-data                  # one writer of the data branch at a time; a newer run waits, it never cancels a running one
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Check out the data branch (or start it on the first run)
        run: bash scripts/ci/checkout_data_branch.sh

      - name: Run the modules
        id: run
        continue-on-error: true            # the data is still committed below even if a module failed
        env:
          EVENT: ${{ github.event_name }}
          MODULES: ${{ inputs.modules }}
          RESUME: ${{ inputs.resume }}
          BUDGET: ${{ inputs.time_budget_minutes }}
        run: |
          ARGS=""
          if [ -n "$MODULES" ]; then ARGS="$ARGS --modules $MODULES"; fi
          if [ "$RESUME" = "true" ]; then ARGS="$ARGS --resume --retry-failed"; fi
          python -m mizan.execution run --trigger "$EVENT" --time-budget-min "${BUDGET:-330}" --publish $ARGS

      - name: Run summary
        if: always()
        run: python -m mizan.execution status --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Save the data to the data branch
        if: always()
        run: bash scripts/ci/commit_data_branch.sh "data $(date -u +%F) run ${GITHUB_RUN_ID}"

      - name: Fail the job if a module failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::One or more modules failed - see the run summary above"
          exit 1
