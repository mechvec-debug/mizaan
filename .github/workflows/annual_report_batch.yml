name: Annual report batch

# The controlled AI reading of annual reports: at most 100 stocks a day, stops at the token budget, resumes tomorrow.
# It writes Shariah evidence; the next Daily pipeline run turns that into verdicts.
# Until annual_report.daily_token_budget and requests_per_minute are set in config/app.yaml the batch reports "not configured" and exits cleanly.
on:
  schedule:
    - cron: "30 12 * * *"            # 12:30 UTC daily (18:00 IST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mizan-data
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Check out the data branch (or start it on the first run)
        run: bash scripts/ci/checkout_data_branch.sh
      - name: Run the annual-report batch
        id: run
        continue-on-error: true
        run: python -m mizan.execution run --modules annual_report --trigger schedule --time-budget-min 300 --publish
      - name: Run summary
        if: always()
        run: python -m mizan.execution status --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Save the data to the data branch
        if: always()
        run: bash scripts/ci/commit_data_branch.sh "annual-report batch $(date -u +%F) run ${GITHUB_RUN_ID}"
      - name: Fail the job if the batch failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::The annual-report batch failed - see the run summary above"
          exit 1
